<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rhiroe</title>
    <script>
      // GitHub Pages用のSPAリダイレクト処理
      // 404ページから元のURLパスを保持してindex.htmlにリダイレクト
      (function() {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        
        // GitHub Pagesのリポジトリ名がある場合の処理
        // この場合はルートなので不要だが、将来的な拡張性のため残す
        var pathSegmentsToKeep = 0;
        var pathArray = path.split('/').filter(function(segment) {
          return segment !== '';
        });
        pathArray.splice(0, pathSegmentsToKeep);
        
        var redirectPath = '/' + pathArray.join('/');
        
        // パス情報をセッションストレージに保存
        sessionStorage.setItem('redirectPath', redirectPath + search + hash);
        
        // index.htmlにリダイレクト
        window.location.replace('/');
      })();
    </script>
  </head>
  <body>
    <div>Loading...</div>
  </body>
</html>
