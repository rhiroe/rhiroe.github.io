# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for more information:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
# https://containers.dev/guide/dependabot

version: 2
updates:
  # Dev containers
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: weekly

  # pnpm の package.json の依存関係を監視
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 20  # 個別PRのため上限を増やす
    
    # PRのメタデータ設定
    commit-message:
      prefix: "chore"
      include: "scope"
    
    # 更新の設定
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    
    # 自動マージ用のラベル
    labels:
      - "dependencies"
      - "dependabot"
    
    # グループ化設定
    groups:
      # React関連パッケージは常に一緒に更新
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "react-router-dom"
      
      # Vite関連パッケージもグループ化
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
      
      # MUI関連パッケージもグループ化（Emotionも含む）
      mui:
        patterns:
          - "@mui/*"
          - "@emotion/*"
          - "styled-components"
      
      # Testing関連パッケージもグループ化
      testing:
        patterns:
          - "@testing-library/*"
          - "jest"
          - "jest-environment-jsdom"
          - "ts-jest"
          - "@types/jest"
      
      # Remark/Rehypeエコシステム（Markdownパイプライン）
      markdown-processing:
        patterns:
          - "remark"
          - "remark-*"
          - "rehype"
          - "rehype-*"
          - "gray-matter"
      
      # TypeScript関連
      typescript:
        patterns:
          - "typescript"
          - "@types/*"
          - "tsx"
      
      # ESLint関連
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "@typescript-eslint/*"

  # GitHub Actions の依存関係も監視
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "github-actions"
      - "dependabot"
