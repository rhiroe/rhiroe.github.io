name: Deploy to GitHub Pages

# 権限設定を最小限に（CIジョブには読み取り権限のみ）
permissions:
  contents: read        # リポジトリ内容の読み取り

on:
  push:
    branches:
      - main

# 同時実行制御
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  ESLint:
    uses: ./.github/workflows/_eslint.yml

  Test:
    uses: ./.github/workflows/_test.yml

  Build:
    needs:
      - ESLint
      - Test

    runs-on: ubuntu-latest
    
    permissions:
      pages: write          # Pages アーティファクトのアップロードに必要

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      
      - name: corepack enable
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Download browser
        run: pnpm exec playwright install

      - name: Build
        env:
          EXPORT: true
        run: pnpm build

      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: out
          name: github-pages
          retention-days: 1

  Deploy:
    needs: Build

    permissions:
      contents: read        # リポジトリ内容の読み取り（継承されないため明示的に設定）
      pages: write          # GitHub Pages へのデプロイに必要
      id-token: write       # OIDC認証に必要

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
