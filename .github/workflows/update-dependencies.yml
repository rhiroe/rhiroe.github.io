name: Update Dependencies (Individual PRs)

on:
  schedule:
    # 毎週月曜日の9:00 (JST) に実行
    - cron: '0 0 * * 1'
  workflow_dispatch: # 手動実行も可能
    inputs:
      update_type:
        description: 'Update type'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - patch
          - minor
          - major

jobs:
  check-updates:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.get-packages.outputs.packages }}
      has_updates: ${{ steps.get-packages.outputs.has_updates }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: corepack enable
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get outdated packages
        id: get-packages
        run: |
          echo "Getting outdated packages list using unified script..."
          
          # 統合スクリプトを使用してJSONデータを取得
          if npx tsx scripts/update-deps.ts --check --json > outdated.json 2>/dev/null; then
            if [ -s outdated.json ]; then
              # JSON データを GitHub Actions 出力形式に変換
              packages=$(cat outdated.json | jq -r '@json')
              echo "packages=$packages" >> $GITHUB_OUTPUT
              echo "has_updates=true" >> $GITHUB_OUTPUT
              echo "Found packages to update:"
              cat outdated.json | jq .
            else
              echo "packages=[]" >> $GITHUB_OUTPUT
              echo "has_updates=false" >> $GITHUB_OUTPUT
              echo "No updates available"
            fi
          else
            echo "packages=[]" >> $GITHUB_OUTPUT
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "No updates available"
          fi

  update-individual-packages:
    needs: check-updates
    if: needs.check-updates.outputs.has_updates == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJson(needs.check-updates.outputs.packages) }}
      fail-fast: false
      max-parallel: 3  # 同時実行数を制限
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: corepack enable
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update specific package
        run: |
          echo "Updating ${{ matrix.package.name }} from ${{ matrix.package.current }} to ${{ matrix.package.latest }}"
          npx tsx scripts/update-deps.ts ${{ matrix.package.name }}

      - name: Run tests
        run: |
          echo "Running tests for ${{ matrix.package.name }} update..."
          pnpm lint || echo "Lint failed but continuing..."
          pnpm test || echo "Tests failed but continuing..."

      - name: Build project
        env:
          EXPORT: true
        run: |
          echo "Building project after ${{ matrix.package.name }} update..."
          pnpm build || echo "Build failed but continuing..."

      - name: Commit changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add .
            git commit -m "chore(deps): update ${{ matrix.package.name }} to ${{ matrix.package.latest }}"
          else
            echo "No changes to commit"
            exit 0
          fi

      - name: Create Pull Request with gh CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # ブランチ名を設定
          BRANCH_NAME="chore/update-${{ matrix.package.name }}-${{ matrix.package.latest }}"
          
          # 新しいブランチを作成してプッシュ
          git checkout -b "$BRANCH_NAME"
          git push origin "$BRANCH_NAME"
          
          # PR本文を作成
          cat > pr_body.md << 'EOF'
          ## 📦 Update ${{ matrix.package.name }}
          
          Updates `${{ matrix.package.name }}` from `${{ matrix.package.current }}` to `${{ matrix.package.latest }}`
          
          ### 📋 Details
          - **Package**: ${{ matrix.package.name }}
          - **Previous Version**: ${{ matrix.package.current }}
          - **New Version**: ${{ matrix.package.latest }}
          - **Update Type**: ${{ matrix.package.updateType }}
          - **Dependency Type**: ${{ matrix.package.type }}
          
          ### 🧪 Verification Status
          - ✅ Package updated successfully
          - ⚠️ Please check the Actions tab for test and build results
          
          ### 📚 Resources
          - [NPM Package](https://www.npmjs.com/package/${{ matrix.package.name }})
          - [GitHub Repository](https://github.com/search?q=${{ matrix.package.name }}&type=repositories)
          
          ---
          *This PR was automatically created by the update-dependencies workflow*
          EOF
          
          # auto-merge フラグを設定（patch/minor更新の場合）
          AUTO_MERGE_FLAG=""
          if [[ "${{ matrix.package.updateType }}" == "patch" || "${{ matrix.package.updateType }}" == "minor" ]]; then
            AUTO_MERGE_FLAG="--label auto-merge"
          fi
          
          # PRを作成
          gh pr create \
            --title "chore(deps): update ${{ matrix.package.name }} to ${{ matrix.package.latest }}" \
            --body-file pr_body.md \
            --label "dependencies,automated,${{ matrix.package.updateType }}-update" \
            $AUTO_MERGE_FLAG \
            --head "$BRANCH_NAME" \
            --base main || echo "PR already exists or failed to create"
