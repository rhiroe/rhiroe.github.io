name: Run Jest

# 必要最小限の権限設定
permissions:
  contents: read  # リポジトリ内容の読み取りのみ

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      
      - name: corepack enable
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run jest
        run: pnpm test
