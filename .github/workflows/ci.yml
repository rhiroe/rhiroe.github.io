name: CI

# 必要最小限の権限設定（CIジョブには読み取り権限のみ）
permissions:
  contents: read        # リポジトリ内容の読み取り

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # PRに対してはpull_requestイベントのみを使用し、重複実行を防ぐ
  # mainブランチ以外への直接pushに対してのみCIを実行する場合は以下を有効化
  # push:
  #   branches-ignore:
  #     - main

jobs:
  ESLint:
    uses: ./.github/workflows/_eslint.yml

  Test:
    uses: ./.github/workflows/_test.yml

  Build:
    needs:
      - ESLint
      - Test

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: "npm"

      - name: Install dependencies
        run: npm ci
      
      - name: Download browser
        run: npx playwright install

      - name: Build
        env:
          NODE_ENV: production
        run: npm run build

  # ビルド成功を確認するための統合チェック
  ci-success:
    runs-on: ubuntu-latest
    needs: [ESLint, Test, Build]
    if: always()
    
    steps:
      - name: Check CI Status
        run: |
          if [[ "${{ needs.ESLint.result }}" != "success" ]]; then
            echo "❌ ESLint failed"
            exit 1
          fi
          
          if [[ "${{ needs.Test.result }}" != "success" ]]; then
            echo "❌ Tests failed"
            exit 1
          fi
          
          if [[ "${{ needs.Build.result }}" != "success" ]]; then
            echo "❌ Build failed"
            exit 1
          fi
          
          echo "✅ All CI checks passed successfully!"
          echo "- ESLint: ${{ needs.ESLint.result }}"
          echo "- Tests: ${{ needs.Test.result }}"
          echo "- Build: ${{ needs.Build.result }}"

  # Dependabot PR の自動マージ
  auto-merge:
    needs: [ci-success]
    uses: ./.github/workflows/_auto-merge-dependabot.yml
    if: always() && needs.ci-success.result == 'success'
    permissions:
      contents: write       # マージに必要
      pull-requests: write  # PRの操作に必要
